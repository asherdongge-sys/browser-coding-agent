name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Runtime smoke test
        shell: bash
        run: |
          pnpm --filter @browser-coding-agent/runtime dev > /tmp/browser-coding-agent-runtime.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4317/ > /tmp/runtime-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/runtime-health.json
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const socket = new WebSocket('ws://127.0.0.1:4317');
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('WebSocket smoke test timed out')), 5000);
            socket.on('open', () => socket.send(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'runtime.ping' })));
            socket.on('message', (raw) => {
              clearTimeout(timeout);
              const message = JSON.parse(raw.toString());
              if (message.result?.ok !== true) reject(new Error(`Unexpected response: ${raw}`));
              else resolve();
              socket.close();
            });
            socket.on('error', reject);
          });
          NODE
          cat /tmp/browser-coding-agent-runtime.log
