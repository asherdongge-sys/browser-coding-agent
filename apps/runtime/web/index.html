<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Browser Coding Agent</title>
<style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7e9ee;background:#0b0d12}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:280px 1fr;background:radial-gradient(circle at top,#151a24,#0b0d12 55%)}button,input,textarea{font:inherit}button{cursor:pointer}.sidebar{border-right:1px solid #252a35;padding:18px;display:flex;flex-direction:column;gap:14px}.brand{font-size:18px;font-weight:700}.muted{color:#8c93a1;font-size:12px}.new,.github{border:0;border-radius:10px;padding:11px 14px;font-weight:650}.new{background:#fff;color:#101217}.github{background:#202632;color:#e7e9ee;border:1px solid #303746}.github.connected{background:#17351f;border-color:#285a35}.github:disabled{opacity:.55;cursor:wait}.agents{display:flex;flex-direction:column;gap:7px;overflow:auto}.agent{width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:11px;background:transparent;color:#e7e9ee}.agent:hover,.agent.active{background:#171b24;border-color:#2b3240}.agent-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-state{margin-top:4px;color:#8c93a1;font-size:12px}.main{min-width:0;display:flex;flex-direction:column}.top{height:66px;border-bottom:1px solid #252a35;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.title{font-weight:650}.status{color:#8c93a1;font-size:12px;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{flex:1;overflow:auto;padding:28px clamp(18px,8vw,120px);display:flex;flex-direction:column;gap:16px}.msg{max-width:820px;padding:14px 16px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.msg.user{align-self:flex-end;background:#263143}.msg.assistant{align-self:flex-start;background:#151a22;border:1px solid #252b36}.msg.tool{align-self:flex-start;background:#10141b;border:1px dashed #384252;color:#aab2c0;font-family:ui-monospace,Consolas,monospace;font-size:12px}.empty{margin:auto;color:#777f8e;text-align:center}.composer{border-top:1px solid #252a35;padding:16px clamp(18px,8vw,120px);display:flex;gap:10px}.composer textarea{flex:1;resize:none;min-height:52px;max-height:180px;background:#11151d;border:1px solid #303746;border-radius:12px;color:#fff;padding:14px;outline:none}.send,.task{border:0;border-radius:12px;color:#101217;font-weight:650;padding:0 16px}.send{background:#fff}.task{background:#c8d4ff}.send:disabled,.task:disabled{opacity:.45}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.modal.hidden{display:none}.card{width:min(520px,calc(100vw - 32px));background:#12161e;border:1px solid #303746;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}.card h2{margin:0}.card input,.card textarea{width:100%;background:#0d1118;border:1px solid #303746;color:#fff;border-radius:10px;padding:11px}.actions{display:flex;justify-content:flex-end;gap:8px}.secondary{background:#222833;color:#ddd;border:1px solid #303746;border-radius:10px;padding:9px 13px}.primary{background:#fff;color:#101217;border:0;border-radius:10px;padding:9px 13px;font-weight:650}</style>
</head>
<body><aside class="sidebar"><div class="brand">Browser Coding Agent</div><div class="muted">Web Dashboard · Agent Runtime</div><button id="newAgent" class="new">＋ 新建 Agent</button><button id="github" class="github" type="button">连接 GitHub</button><div id="githubStatus" class="muted">检查 GitHub 连接状态…</div><div id="agents" class="agents"></div></aside><main class="main"><header class="top"><div><div id="title" class="title">选择一个 Agent</div><div id="status" class="status">Runtime 未连接</div></div><div class="muted">每个 Agent 对应一个独立 ChatGPT 对话</div></header><section id="messages" class="messages"><div class="empty">创建 Agent 后，它会打开独立的 ChatGPT 页面。首次使用需要登录。</div></section><footer class="composer"><textarea id="input" placeholder="聊天：给当前 Agent 发送消息；任务：让 Agent 操作浏览器" disabled></textarea><button id="send" class="send" disabled>聊天</button><button id="task" class="task" disabled>执行任务</button></footer></main><div id="modal" class="modal hidden"><div class="card"><h2>新建 Agent</h2><input id="agentTitle" placeholder="Agent 名称，例如：研究 Agent" /><textarea id="agentPrompt" rows="5" placeholder="可选：创建后立即发送给 ChatGPT 的第一条指令"></textarea><div class="actions"><button id="cancel" class="secondary">取消</button><button id="create" class="primary">创建</button></div></div></div>
<script>
const $=id=>document.getElementById(id);const ws=new WebSocket(`ws://${location.host}`);let rid=0,agents=[],selected=null,messages={};const pending=new Map();const hydrated=new Set();let browserProvider='unknown';
function rpc(method,params={}){return new Promise((resolve,reject)=>{const id=String(++rid);pending.set(id,{resolve,reject});if(ws.readyState!==WebSocket.OPEN){pending.delete(id);reject(new Error('Runtime WebSocket 未连接'));return}ws.send(JSON.stringify({jsonrpc:'2.0',id,method,params}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('请求超时'))}},120000)})}
function state(a){return ({'opening-chatgpt':'正在打开 ChatGPT','restoring':'正在恢复','login-required':'等待登录','waiting':'等待 ChatGPT','idle':'空闲','failed':'失败','tab-closed':'标签页已关闭','sending':'正在发送','planning':'正在规划','inspecting':'正在操作浏览器','completed':'任务完成'})[a.status]||a.status}
function providerText(){return browserProvider==='playwright'?'Playwright 托管浏览器':browserProvider==='extension'?'Chrome Extension Bridge':'未知浏览器后端'}
function hydrateAgent(a,force=false){if((force||!hydrated.has(a.id))&&Array.isArray(a.messages)){messages[a.id]=a.messages.map(m=>({role:m.role,text:m.text,createdAt:m.createdAt}));hydrated.add(a.id)}return a}
function renderAgents(){const el=$('agents');el.innerHTML='';if(!agents.length){el.innerHTML='<div class="muted">还没有 Agent</div>';return}for(const a of agents){const b=document.createElement('button');b.className='agent'+(a.id===selected?' active':'');b.innerHTML='<div class="agent-title"></div><div class="agent-state"></div>';b.querySelector('.agent-title').textContent=a.title;b.querySelector('.agent-state').textContent=state(a);b.onclick=()=>select(a.id);el.append(b)}}
function renderMessages(){const el=$('messages');el.innerHTML='';const list=messages[selected]||[];if(!selected||!list.length){el.innerHTML='<div class="empty">这个 Agent 还没有消息。</div>';return}for(const m of list){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;el.append(d)}el.scrollTop=el.scrollHeight}
function select(id,loadHistory=false){selected=id;const a=agents.find(x=>x.id===id);if(!a)return;hydrateAgent(a,loadHistory);$('title').textContent=a.title;$('status').textContent=state(a)+(a.lastError?' · '+a.lastError:'')+` · ${providerText()}`;const disabled=['opening-chatgpt','login-required','restoring','sending','waiting','planning','inspecting'].includes(a.status);$('input').disabled=disabled;$('send').disabled=disabled;$('task').disabled=disabled;renderAgents();renderMessages()}
function addMessage(id,role,text,streaming=false){const list=messages[id]??(messages[id]=[]);const last=list.at(-1);if(last?.role===role&&streaming){last.text=text;renderIfSelected(id);return}if(role==='assistant'&&last?.role==='assistant'&&last.text===text)return;list.push({role,text,createdAt:Date.now()});renderIfSelected(id)}
function renderIfSelected(id){if(selected===id)renderMessages()}
async function refreshGitHub(){const b=$('github');const s=$('githubStatus');try{const response=await fetch('/api/github/status',{cache:'no-store'});const r=await response.json();if(r.connected){b.disabled=false;b.textContent=`GitHub：@${r.login||'已连接'}`;b.classList.add('connected');s.textContent='GitHub 已连接，新 Agent 可使用 GitHub MCP';b.onclick=async()=>{if(confirm('断开 GitHub 连接？')){b.disabled=true;try{await fetch('/api/github/disconnect',{method:'POST'})}finally{b.disabled=false;refreshGitHub()}}}}else{b.disabled=false;b.textContent='连接 GitHub';b.classList.remove('connected');s.textContent=r.configured?'点击连接 GitHub，完成授权后自动回到本页面':'GitHub OAuth 未配置：请创建 .github-oauth.local.json';b.onclick=async()=>{b.disabled=true;b.textContent='正在连接 GitHub…';try{const response=await fetch('/api/github/connect',{redirect:'manual'});const locationHeader=response.headers.get('location');if(response.status>=300&&response.status<400&&locationHeader){location.href=locationHeader;return}const body=await response.text();throw new Error(body||`GitHub OAuth connect failed: HTTP ${response.status}`)}catch(e){b.disabled=false;b.textContent='连接 GitHub';s.textContent=e instanceof Error?e.message:String(e)}}}}catch(e){b.disabled=false;b.textContent='连接 GitHub';s.textContent='GitHub 状态获取失败：'+(e instanceof Error?e.message:String(e))}}
ws.onopen=async()=>{try{const hello=await rpc('runtime.hello',{role:'dashboard'});browserProvider=hello.browserProvider||'unknown';$('status').textContent=`Runtime 已连接 · ${providerText()}`;const r=await rpc('agent.list');agents=(r.agents||[]).map(a=>hydrateAgent(a,true));renderAgents();if(agents[0])select(agents[0].id);await refreshGitHub();const q=new URLSearchParams(location.search);if(q.get('github')==='connected')await refreshGitHub()}catch(e){$('status').textContent=e.message}};
ws.onclose=()=>{$('status').textContent='Runtime WebSocket 已断开';$('input').disabled=true;$('send').disabled=true;$('task').disabled=true};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id!==undefined&&!m.method){const p=pending.get(String(m.id));if(p){pending.delete(String(m.id));m.error?p.reject(new Error(m.error.message||'请求失败')):p.resolve(m.result)}return}if(m.method!=='dashboard.event')return;const p=m.params||{};if(p.type==='agent.created'){const a=hydrateAgent(p.agent,true);const i=agents.findIndex(x=>x.id===a.id);if(i>=0)agents[i]=a;else agents.unshift(a);renderAgents();if(selected===a.id)select(a.id)}if(p.type==='agent.updated'){const a=p.agent;const i=agents.findIndex(x=>x.id===a.id);if(i>=0){agents[i]={...agents[i],...a};if(Array.isArray(a.messages)&&!hydrated.has(a.id))hydrateAgent(agents[i],true)}else agents.unshift(hydrateAgent(a,true));renderAgents();if(selected===a.id)select(a.id)}if(p.type==='agent.message')addMessage(p.agentId,p.role,p.text,Boolean(p.streaming));if(p.type==='agent.state'){const a=agents.find(x=>x.id===p.agentId);if(a){a.status=p.state||a.status;renderAgents();if(selected===a.id)select(a.id)}}if(p.type==='agent.tool.call'){addMessage(p.agentId,'tool',`→ ${p.call.tool} ${JSON.stringify(p.call.arguments)}`)}if(p.type==='agent.tool.result'){addMessage(p.agentId,'tool',`← ${p.call.tool}: ${JSON.stringify(p.result)}`)}};
$('newAgent').onclick=()=>{$('modal').classList.remove('hidden');$('agentTitle').focus()};$('cancel').onclick=()=>$('modal').classList.add('hidden');$('create').onclick=async()=>{const title=$('agentTitle').value.trim(),prompt=$('agentPrompt').value.trim();$('create').disabled=true;try{const r=await rpc('agent.create',{title,prompt});$('modal').classList.add('hidden');const a=hydrateAgent(r.agent,true);const i=agents.findIndex(x=>x.id===a.id);if(i>=0)agents[i]=a;else agents.unshift(a);select(a.id)}catch(e){alert(e.message)}finally{$('create').disabled=false}};
async function sendChat(){const text=$('input').value.trim();if(!selected||!text)return;$('input').value='';addMessage(selected,'user',text);$('send').disabled=true;try{await rpc('agent.send',{agentId:selected,text})}catch(e){alert(e.message)}finally{const a=agents.find(x=>x.id===selected);if(a)select(a.id)}}
async function runTask(){const goal=$('input').value.trim();if(!selected||!goal)return;$('input').value='';addMessage(selected,'user','[浏览器任务] '+goal);$('task').disabled=true;try{await rpc('agent.send',{agentId:selected,text:'::browser-task::'+goal})}catch(e){alert(e.message)}finally{const a=agents.find(x=>x.id===selected);if(a)select(a.id)}}
$('send').onclick=sendChat;$('task').onclick=runTask;$('input').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();sendChat()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Enter'){e.preventDefault();runTask()}};
refreshGitHub();
</script></body></html>
