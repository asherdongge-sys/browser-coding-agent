<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browser Coding Agent</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7e9ee;background:#0b0d12}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:280px 1fr;background:radial-gradient(circle at top,#151a24,#0b0d12 55%)}button,input,textarea{font:inherit}button{cursor:pointer}.sidebar{border-right:1px solid #252a35;padding:18px;display:flex;flex-direction:column;gap:14px}.brand{font-size:18px;font-weight:700}.muted{color:#8c93a1;font-size:12px}.new{border:0;border-radius:10px;padding:11px 14px;background:#fff;color:#101217;font-weight:650}.agents{display:flex;flex-direction:column;gap:7px;overflow:auto}.agent{width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:11px;background:transparent;color:#e7e9ee}.agent:hover,.agent.active{background:#171b24;border-color:#2b3240}.agent-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-state{margin-top:4px;color:#8c93a1;font-size:12px}.main{min-width:0;display:flex;flex-direction:column}.top{height:66px;border-bottom:1px solid #252a35;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.title{font-weight:650}.status{color:#8c93a1;font-size:12px;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{flex:1;overflow:auto;padding:28px clamp(18px,8vw,120px);display:flex;flex-direction:column;gap:16px}.msg{max-width:820px;padding:14px 16px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.msg.user{align-self:flex-end;background:#263143}.msg.assistant{align-self:flex-start;background:#151a22;border:1px solid #252b36}.empty{margin:auto;color:#777f8e;text-align:center}.composer{border-top:1px solid #252a35;padding:16px clamp(18px,8vw,120px);display:flex;gap:10px}.composer textarea{flex:1;resize:none;min-height:52px;max-height:180px;background:#11151d;border:1px solid #303746;border-radius:12px;color:#fff;padding:14px;outline:none}.send{width:90px;border:0;border-radius:12px;background:#fff;color:#101217;font-weight:650}.send:disabled{opacity:.45}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.modal.hidden{display:none}.card{width:min(520px,calc(100vw - 32px));background:#12161e;border:1px solid #303746;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}.card h2{margin:0}.card input,.card textarea{width:100%;background:#0d1118;border:1px solid #303746;color:#fff;border-radius:10px;padding:11px}.actions{display:flex;justify-content:flex-end;gap:8px}.secondary{background:#222833;color:#ddd;border:1px solid #303746;border-radius:10px;padding:9px 13px}.primary{background:#fff;color:#101217;border:0;border-radius:10px;padding:9px 13px;font-weight:650}
</style>
</head>
<body>
<aside class="sidebar"><div class="brand">Browser Coding Agent</div><div class="muted">Web Dashboard · ChatGPT Browser Brain</div><button id="newAgent" class="new">＋ 新建 Agent</button><div id="agents" class="agents"></div></aside>
<main class="main"><header class="top"><div><div id="title" class="title">选择一个 Agent</div><div id="status" class="status">Runtime 未连接</div></div><div class="muted">每个 Agent 对应一个独立 ChatGPT 对话</div></header><section id="messages" class="messages"><div class="empty">创建 Agent 后，它会打开独立的 ChatGPT 标签页。首次使用需要登录。</div></section><footer class="composer"><textarea id="input" placeholder="给当前 Agent 发送下一条消息…（Ctrl/Cmd + Enter）" disabled></textarea><button id="send" class="send" disabled>发送</button></footer></main>
<div id="modal" class="modal hidden"><div class="card"><h2>新建 Agent</h2><input id="agentTitle" placeholder="Agent 名称，例如：前端 Agent" /><textarea id="agentPrompt" rows="5" placeholder="可选：创建后立即发送给 ChatGPT 的第一条指令"></textarea><div class="actions"><button id="cancel" class="secondary">取消</button><button id="create" class="primary">创建</button></div></div></div>
<script>
const $=id=>document.getElementById(id);const ws=new WebSocket(`ws://${location.host}`);let rid=0,agents=[],selected=null,messages={};const pending=new Map();
function rpc(method,params={}){return new Promise((resolve,reject)=>{const id=String(++rid);pending.set(id,{resolve,reject});if(ws.readyState!==WebSocket.OPEN){pending.delete(id);reject(new Error('Runtime WebSocket 未连接'));return}ws.send(JSON.stringify({jsonrpc:'2.0',id,method,params}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('请求超时'))}},20000)})}
function state(a){return ({'opening-chatgpt':'正在打开 ChatGPT','login-required':'等待登录','waiting':'等待 ChatGPT','idle':'空闲','failed':'失败','tab-closed':'标签页已关闭'})[a.status]||a.status}
function renderAgents(){const el=$('agents');el.innerHTML='';if(!agents.length){el.innerHTML='<div class="muted">还没有 Agent</div>';return}for(const a of agents){const b=document.createElement('button');b.className='agent'+(a.id===selected?' active':'');b.innerHTML=`<div class="agent-title"></div><div class="agent-state"></div>`;b.querySelector('.agent-title').textContent=a.title;b.querySelector('.agent-state').textContent=state(a);b.onclick=()=>select(a.id);el.append(b)}}
function renderMessages(){const el=$('messages');el.innerHTML='';const list=messages[selected]||[];if(!selected||!list.length){el.innerHTML='<div class="empty">这个 Agent 还没有消息。</div>';return}for(const m of list){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;el.append(d)}el.scrollTop=el.scrollHeight}
function select(id){selected=id;const a=agents.find(x=>x.id===id);if(!a)return;$('title').textContent=a.title;$('status').textContent=state(a)+(a.lastError?' · '+a.lastError:'');const disabled=a.status==='opening-chatgpt'||a.status==='login-required';$('input').disabled=disabled;$('send').disabled=disabled;renderAgents();renderMessages()}
function addMessage(id,role,text){(messages[id]??=[]).push({role,text});if(selected===id)renderMessages()}
ws.onopen=async()=>{ $('status').textContent='Runtime 已连接，等待浏览器扩展';ws.send(JSON.stringify({jsonrpc:'2.0',id:String(++rid),method:'runtime.hello',params:{role:'dashboard'}}));try{const r=await rpc('agent.list');agents=r.agents||[];renderAgents();if(agents[0])select(agents[0].id)}catch(e){$('status').textContent=e.message}};
ws.onclose=()=>{$('status').textContent='Runtime WebSocket 已断开';$('input').disabled=true;$('send').disabled=true};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id!==undefined&&!m.method){const p=pending.get(String(m.id));if(p){pending.delete(String(m.id));m.error?p.reject(new Error(m.error.message||'请求失败')):p.resolve(m.result)}return}if(m.method==='dashboard.event'){const p=m.params||{};if(p.type==='agent.created'||p.type==='agent.updated'){const a=p.agent;const i=agents.findIndex(x=>x.id===a.id);if(i>=0)agents[i]=a;else agents.unshift(a);renderAgents();if(selected===a.id)select(a.id)}if(p.type==='agent.event'&&p.params){const e=p.params;if(e.type==='agent.message'&&e.agentId&&e.role&&e.text)addMessage(e.agentId,e.role,e.text);if(e.type==='agent.state'&&e.agentId){const a=agents.find(x=>x.id===e.agentId);if(a){a.status=e.state||a.status;renderAgents();if(selected===a.id)select(a.id)}}}}};
$('newAgent').onclick=()=>{$('modal').classList.remove('hidden');$('agentTitle').focus()};$('cancel').onclick=()=>$('modal').classList.add('hidden');$('create').onclick=async()=>{const title=$('agentTitle').value.trim(),prompt=$('agentPrompt').value.trim();$('create').disabled=true;try{const r=await rpc('agent.create',{title,prompt});$('modal').classList.add('hidden');const i=agents.findIndex(x=>x.id===r.agent.id);if(i>=0)agents[i]=r.agent;else agents.unshift(r.agent);select(r.agent.id)}catch(e){alert(e.message)}finally{$('create').disabled=false}};
$('send').onclick=async()=>{const text=$('input').value.trim();if(!selected||!text)return;$('input').value='';addMessage(selected,'user',text);$('send').disabled=true;try{await rpc('agent.send',{agentId:selected,text})}catch(e){alert(e.message)}finally{const a=agents.find(x=>x.id===selected);$('send').disabled=!a||a.status==='opening-chatgpt'||a.status==='login-required'}};$('input').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('send').click()}};
</script>
</body></html>
