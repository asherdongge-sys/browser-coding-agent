<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser Coding Agent</title>
  <style>
    body { width: 380px; margin: 0; padding: 18px; font: 14px system-ui, sans-serif; background:#f7f7f8; color:#202124; box-sizing:border-box; }
    * { box-sizing:border-box; } h1 { font-size:18px; margin:0 0 6px; } .muted { color:#6b7280; font-size:12px; }
    .card { background:#fff; border:1px solid #ddd; border-radius:12px; padding:14px; margin-top:12px; }
    input, textarea { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:10px; font:inherit; }
    input { margin-top:7px; } textarea { min-height:82px; resize:vertical; margin-top:7px; }
    button { border:0; border-radius:8px; padding:10px 12px; cursor:pointer; font-weight:600; } #run { background:#111; color:#fff; width:100%; margin-top:8px; }
    button:disabled { opacity:.5; cursor:not-allowed; } .event { padding:7px 0; border-bottom:1px solid #eee; font-size:12px; } .event:last-child{border-bottom:0}
    .state { display:inline-block; padding:3px 7px; border-radius:999px; background:#eef2ff; font-size:11px; }
  </style>
</head>
<body>
  <h1>Browser Coding Agent</h1>
  <div class="muted" id="connection">正在连接本地 Runtime…</div>
  <div class="card">
    <div class="muted">工作区路径（本机目录）</div>
    <input id="workspace" placeholder="例如：E:\\web\\browser-coding-agent" autocomplete="off">
    <div class="muted" style="margin-top:6px">路径只会发送给本机 Runtime，不会上传到网络。</div>
  </div>
  <div class="card">
    <div class="muted">告诉 Agent 你要做什么</div>
    <textarea id="goal" placeholder="例如：创建 hello.ts，然后运行它"></textarea>
    <button id="run">开始开发</button>
  </div>
  <div class="card">
    <div class="muted">Agent 活动</div>
    <div id="events"><div class="event">等待任务…</div></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
