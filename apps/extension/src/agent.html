<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Coding Agent · Agent 工作台</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d12; color: #e8ecf3; min-height: 100vh; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { border-right: 1px solid #252a35; background: #10131a; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .brand { font-weight: 800; letter-spacing: .2px; }
    .muted { color: #8c96a8; font-size: 12px; line-height: 1.5; }
    .new-agent { border: 0; border-radius: 10px; padding: 11px 13px; background: #2f6feb; color: white; font-weight: 700; }
    .agents { display: flex; flex-direction: column; gap: 7px; overflow: auto; }
    .agent-item { text-align: left; border: 1px solid transparent; border-radius: 10px; padding: 10px; background: transparent; color: inherit; }
    .agent-item:hover, .agent-item.active { background: #191e28; border-color: #2b3341; }
    .agent-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-status { margin-top: 4px; color: #8c96a8; font-size: 11px; }
    .main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
    .topbar { padding: 18px 22px; border-bottom: 1px solid #252a35; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .title { font-size: 18px; font-weight: 800; }
    .status { font-size: 12px; color: #9da7b8; }
    .messages { padding: 24px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: auto; max-width: 520px; text-align: center; color: #8993a5; }
    .message { max-width: 820px; width: fit-content; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.55; }
    .message.user { align-self: flex-end; background: #1e3a66; }
    .message.assistant { align-self: flex-start; background: #171b23; border: 1px solid #252a35; }
    .composer { border-top: 1px solid #252a35; padding: 16px 22px; background: #10131a; }
    .row { display: flex; gap: 9px; }
    textarea, input { width: 100%; border: 1px solid #303746; border-radius: 10px; background: #0b0d12; color: #eef2f8; outline: none; }
    input { padding: 10px 12px; }
    textarea { resize: vertical; min-height: 84px; padding: 12px; }
    textarea:focus, input:focus { border-color: #4b7bd8; }
    .send { min-width: 88px; border: 0; border-radius: 10px; background: #2f6feb; color: white; font-weight: 700; }
    .send:disabled, .new-agent:disabled { opacity: .5; cursor: default; }
    .modal-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .55); display: grid; place-items: center; }
    .modal { width: min(520px, calc(100vw - 30px)); background: #151922; border: 1px solid #303746; border-radius: 14px; padding: 18px; box-shadow: 0 24px 70px rgb(0 0 0 / .45); }
    .modal h2 { margin: 0 0 14px; font-size: 17px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; }
    .secondary { border: 1px solid #303746; border-radius: 9px; background: transparent; color: #c8cfdb; padding: 9px 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">Browser Coding Agent</div>
      <div class="muted">一个 ChatGPT 对话 = 一个 Agent。每个 Agent 使用独立标签页，登录态由浏览器保留。</div>
      <button id="new-agent" class="new-agent">+ 新建 Agent</button>
      <div id="agents" class="agents"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div id="title" class="title">选择一个 Agent</div>
          <div id="status" class="status">首次使用时会打开 ChatGPT 标签页进行登录。</div>
        </div>
        <button id="open-chatgpt" class="secondary">打开 ChatGPT</button>
      </header>
      <section id="messages" class="messages">
        <div class="empty">新建 Agent 后输入任务。Agent 会自动打开独立的 ChatGPT 对话，并在同一对话中持续多轮交流。</div>
      </section>
      <section class="composer">
        <div class="row">
          <textarea id="input" placeholder="给当前 Agent 发消息，Ctrl/Cmd + Enter 发送" disabled></textarea>
          <button id="send" class="send" disabled>发送</button>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2>新建 Agent</h2>
      <label class="muted" for="agent-title-input">名称</label>
      <input id="agent-title-input" placeholder="例如：前端重构 Agent" />
      <div style="height:10px"></div>
      <label class="muted" for="agent-prompt-input">第一条任务</label>
      <textarea id="agent-prompt-input" placeholder="例如：先分析这个项目的架构，再告诉我下一步怎么做"></textarea>
      <div class="modal-actions">
        <button id="cancel" class="secondary">取消</button>
        <button id="create" class="new-agent">创建并运行</button>
      </div>
    </div>
  </div>
  <script type="module" src="agent.js"></script>
</body>
</html>
